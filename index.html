<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gym-website</title>
    <link href="https://fonts.googleapis.com/css2?family=Fugaz One:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="name">
            <img class="logo" src="images/logo.png" alt="Логотип с молнией по середине и двумя накачанными руками">
            <h1>TITAN</h1>
        </div>
        <div class="pages">
            <a href="">Главная</a>
            <a href="">Абонименты</a>
            <a href="">Личный кабинет</a>
        </div>
    </header>  

    <main>
        <section class="about">
            <div class="main_text">
                <h2>Спортивный зал "Титан"</h2>
                <p>Начни тренировать свое тело прямо сейчас.
                Выбирай свободные посещения или занятия с тренерами!</p>
            </div>
            <img src="images/about_picture.jpg" class="main_img">
        </section>

        <section class="gym_photos">
            <h2>Фотографии спортивного зала</h2>
            <div class="slider_container">
                <!-- скрытые радиокнопки -->
                <input type="radio" name="slider" id="slide1" checked>
                <input type="radio" name="slider" id="slide2">
                <input type="radio" name="slider" id="slide3">

                <div class="slider">
                    <!-- фотографии спортзала -->
                    <div class="slides">
                        <div class="slide"><img src="images/gym1.png" alt="Фото спортзала 1"></div>
                        <div class="slide"><img src="images/gym2.png" alt="Фото спортзала 2"></div>
                        <div class="slide"><img src="images/gym3.png" alt="Фото спортзала 3"></div>
                    </div>

                    <!-- точки переключения -->
                    <div class="dots">
                        <label for="slide1" class="dot"></label>
                        <label for="slide2" class="dot"></label>
                        <label for="slide3" class="dot"></label>
                    </div>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
